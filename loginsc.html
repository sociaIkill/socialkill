<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход по ключу</title>
    <link rel="icon" type="image/x-icon" href="img/icon.png">
    <link rel="stylesheet" href="style-login.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <canvas id="particles-bg" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000;"></canvas>
    
    <div class="cursor-dot"></div>
    <div class="cursor-trace"></div>

    <a href="index.html" class="exit-btn" id="logoutBtn" title="Выход">
        <span class="exit-btn-icon"></span>
        <span>ВЫХОД</span>
    </a>

    <img src="img/fon.jpg" alt="Background Photo" class="bg-photo-layer">

    <div class="app-container">
        <div class="photo-wrapper">
            <img src="img/prax.jpg" alt="Profile Photo" id="profileImage">
        </div>

        <div class="logo-center">
            <span>sociaikill</span>
        </div>

        <div class="input-group">
            <input type="password" class="password-input" id="password" placeholder="Ключ">
            <svg class="eye-icon" id="togglePassword" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
        </div>

        <button class="login-btn" id="loginBtn">
            Войти
            <svg style="margin-left: 8px; width: 18px; height: 18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
        </button>
    </div>

    <script src="script-login.js" defer></script>
</body>
</html>
